# 部署说明：在 /opt/backend 目录执行 docker compose up -d --build
# ECS 目录结构：
#   /opt/backend          (后端仓库，本文件所在目录)
#   /var/www/frontend     (前端仓库)

services:
  backend:
    build: .
    container_name: form-backend
    volumes:
      - ./data:/app/data  # SQLite + 附件持久化
    restart: unless-stopped

  frontend:
    build: /var/www/frontend
    container_name: form-frontend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # HTTPS 证书（只读挂载）
    depends_on:
      - backend
    restart: unless-stopped

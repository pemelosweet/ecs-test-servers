# 部署说明：在 /opt/backend 目录执行 docker compose up -d --build
# ECS 目录结构：
#   /opt/backend          (后端仓库，本文件所在目录)
#   /var/www/frontend     (前端仓库)
#
# 可选环境变量（同目录 .env，未设置时使用默认值）：
#   FRONTEND_DIR=/var/www/frontend   前端仓库路径
#   BACKEND_PORT=8000               后端服务端口
#   TZ=Asia/Shanghai                容器时区
#
# 说明：前端对外暴露 80/443，后端只在内网暴露（不发布到宿主机），
#       由 nginx 反代 /api 转发到 backend:8000。HTTPS 证书需提前
#       在宿主机用 certbot 申请 admin.xmg111.xyz 的证书。

services:
  backend:
    build: .
    image: form-backend:local
    container_name: form-backend
    expose:
      - "${BACKEND_PORT:-8000}"   # 仅对内网暴露，由前端反代访问
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - ./data:/app/data          # SQLite + 附件持久化
    healthcheck:
      # 后端就绪后再放行前端启动；空列表也返回 200，可安全作为探针
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:${BACKEND_PORT:-8000}/api/forms')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - app-net

  frontend:
    build: ${FRONTEND_DIR:-/var/www/frontend}
    image: form-frontend:local
    container_name: form-frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      - TZ=${TZ:-Asia/Shanghai}
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro  # HTTPS 证书（只读挂载，含 admin.xmg111.xyz）
    depends_on:
      backend:
        condition: service_healthy   # 等后端健康检查通过后再启动
    restart: unless-stopped
    networks:
      - app-net

networks:
  app-net:
    driver: bridge

# 本仓库 push 后，通知 ecs-frontend 仓库的自托管 runner 执行部署
name: Notify Deploy

on:
  push:
    branches: [main]

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger ecs-frontend deploy
        run: |
          curl -sf -X POST \
            -H "Authorization: token ${{ secrets.DEPLOY_PAT }}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/pemelosweet/ecs-frontend/dispatches \
            -d '{"event_type":"deploy"}'
